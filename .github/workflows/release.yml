name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: |
          dotnet restore Daxis.sln --locked-mode
          dotnet test tests/Daxis.Tests -c Release --no-restore
      - name: Publish single-file builds
        run: |
          v="${GITHUB_REF_NAME#v}"
          for rid in win-x64 linux-x64; do
            dotnet publish src/Daxis.App -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
              -p:Version="$v" -o "out/$rid"
          done
          mkdir dist
          mv out/win-x64/Daxis.exe "dist/Daxis-$v-win-x64.exe"
          mv out/linux-x64/Daxis "dist/Daxis-$v-linux-x64"
          cp LICENSE THIRD-PARTY-NOTICES.md dist/
          (cd dist && sha256sum Daxis-* > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Daxis-*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
