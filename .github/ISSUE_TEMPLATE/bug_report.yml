name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Daxis version or commit
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Sign-in, Workspaces, Semantic model, Notebook, Lakehouse, Other]
  - type: markdown
    attributes:
      value: "**Never paste tokens, connection strings with secrets, or customer data.** Security issues: see SECURITY.md."
